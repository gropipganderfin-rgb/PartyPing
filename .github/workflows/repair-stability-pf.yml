name: Repair PartyPing Stability and PF

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-stability-pf.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stability and PF fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $scannerPath = 'LocalPfScanner.cs'
          $scanner = Get-Content $scannerPath -Raw

          $requestNeedle = '            if (!RequestLocalPfHighEndListings())'
          if (-not $scanner.Contains($requestNeedle)) { throw 'PF request call not found' }
          $requestReplacement = "            // Native FFXIV agent calls must run on the framework/game thread.`n            var requestAccepted = await Framework.Run(`n                RequestLocalPfHighEndListings,`n                cancellation.Token).ConfigureAwait(false);`n`n            if (!requestAccepted)"
          $scanner = $scanner.Replace($requestNeedle, $requestReplacement)

          $nativeNeedle = '        return agent != null && agent->RequestCategoryListings(LocalPfHighEndDutyCategory);'
          if (-not $scanner.Contains($nativeNeedle)) { throw 'PF native request line not found' }
          $nativeReplacement = "        if (agent is null)`n            return false;`n`n        // Force a data-center, normal-party query so a World/Private PF tab`n        // cannot silently hide valid prog listings from PartyPing.`n        agent->SearchAreaTab = 0;`n        agent->GroupTypeTab = 0;`n`n        return agent->RequestCategoryListings(LocalPfHighEndDutyCategory);"
          $scanner = $scanner.Replace($nativeNeedle, $nativeReplacement)

          $scanner = $scanner.Replace('private static readonly TimeSpan LocalPfMaximumReceiveWindow = TimeSpan.FromSeconds(5);', 'private static readonly TimeSpan LocalPfMaximumReceiveWindow = TimeSpan.FromSeconds(8);')
          $scanner = $scanner.Replace('private static readonly TimeSpan LocalPfMinimumReceiveWindow = TimeSpan.FromMilliseconds(1500);', 'private static readonly TimeSpan LocalPfMinimumReceiveWindow = TimeSpan.FromMilliseconds(2000);')
          $scanner = $scanner.Replace('private static readonly TimeSpan LocalPfQuietPeriod = TimeSpan.FromMilliseconds(900);', 'private static readonly TimeSpan LocalPfQuietPeriod = TimeSpan.FromMilliseconds(1200);')
          Set-Content $scannerPath $scanner -NoNewline

          $pollingPath = 'AutoLocalPfPolling.cs'
          $polling = Get-Content $pollingPath -Raw
          if (-not $polling.Contains('TimeSpan.FromMilliseconds(500)')) { throw 'Party tracker interval not found' }
          $polling = $polling.Replace('TimeSpan.FromMilliseconds(500)', 'TimeSpan.FromMilliseconds(1000)')
          Set-Content $pollingPath $polling -NoNewline

          $crossRealmBase64 = ''
          [IO.File]::WriteAllBytes('CrossRealmPartyTracker.cs', [Convert]::FromBase64String($crossRealmBase64))

          Set-Content 'version.txt' '0.7.12.0'
          Remove-Item '.github/workflows/repair-stability-pf.yml'

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize cross-world tracking and PF polling"
          git push origin HEAD:main
