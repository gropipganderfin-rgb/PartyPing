name: Repair PartyPing Stability and PF

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-stability-pf.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stability and PF fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $scannerPath = 'LocalPfScanner.cs'
          $scanner = Get-Content $scannerPath -Raw

          $oldRequestCall = @'
            if (!RequestLocalPfHighEndListings())
            {
                LocalPfStatus = "Local PF: FFXIV rejected the Party Finder refresh request";
                return;
            }
'@
          $newRequestCall = @'
            // Native FFXIV agent calls must run on the framework/game thread.
            var requestAccepted = await Framework.Run(
                RequestLocalPfHighEndListings,
                cancellation.Token).ConfigureAwait(false);

            if (!requestAccepted)
            {
                LocalPfStatus = "Local PF: FFXIV rejected the Party Finder refresh request";
                return;
            }
'@
          if (-not $scanner.Contains($oldRequestCall)) { throw 'PF request call block not found' }
          $scanner = $scanner.Replace($oldRequestCall, $newRequestCall)

          $oldRequestMethod = @'
    private static unsafe bool RequestLocalPfHighEndListings()
    {
        var agent = AgentLookingForGroup.Instance();
        return agent != null && agent->RequestCategoryListings(LocalPfHighEndDutyCategory);
    }
'@
          $newRequestMethod = @'
    private static unsafe bool RequestLocalPfHighEndListings()
    {
        var agent = AgentLookingForGroup.Instance();
        if (agent is null)
            return false;

        // Always query the full data-center PF instead of inheriting a user's
        // World/Private tab selection, which can silently hide valid prog parties.
        agent->SearchAreaTab = 0; // Data Center
        agent->GroupTypeTab = 0;  // Normal party

        return agent->RequestCategoryListings(LocalPfHighEndDutyCategory);
    }
'@
          if (-not $scanner.Contains($oldRequestMethod)) { throw 'PF request method block not found' }
          $scanner = $scanner.Replace($oldRequestMethod, $newRequestMethod)

          $scanner = $scanner.Replace(
              'private static readonly TimeSpan LocalPfMaximumReceiveWindow = TimeSpan.FromSeconds(5);',
              'private static readonly TimeSpan LocalPfMaximumReceiveWindow = TimeSpan.FromSeconds(8);')
          $scanner = $scanner.Replace(
              'private static readonly TimeSpan LocalPfMinimumReceiveWindow = TimeSpan.FromMilliseconds(1500);',
              'private static readonly TimeSpan LocalPfMinimumReceiveWindow = TimeSpan.FromMilliseconds(2000);')
          $scanner = $scanner.Replace(
              'private static readonly TimeSpan LocalPfQuietPeriod = TimeSpan.FromMilliseconds(900);',
              'private static readonly TimeSpan LocalPfQuietPeriod = TimeSpan.FromMilliseconds(1200);')
          Set-Content $scannerPath $scanner -NoNewline

          $pollingPath = 'AutoLocalPfPolling.cs'
          $polling = Get-Content $pollingPath -Raw
          if (-not $polling.Contains('TimeSpan.FromMilliseconds(500)')) { throw 'Party tracker interval not found' }
          $polling = $polling.Replace('TimeSpan.FromMilliseconds(500)', 'TimeSpan.FromMilliseconds(1000)')
          Set-Content $pollingPath $polling -NoNewline

          @'
using FFXIVClientStructs.FFXIV.Client.UI.Info;

namespace PartyPing;

public sealed partial class Plugin
{
    private unsafe void TrackJoinedPartyCardRobust()
    {
        if (TryTrackCrossRealmParty())
            return;

        TrackJoinedPartyCard();
    }

    private unsafe bool TryTrackCrossRealmParty()
    {
        // Avoid calling InfoProxyCrossRealm member functions from the tracker.
        // Reading the already-populated proxy fields is enough and removes a
        // native-call crash surface from a loop that runs for the whole session.
        var proxy = InfoProxyCrossRealm.Instance();
        if (proxy is null || !proxy->IsInCrossRealmParty || proxy->IsInAllianceRaid)
            return false;

        var availableGroups = proxy->CrossRealmGroups.Length;
        var groupCount = Math.Clamp((int)proxy->GroupCount, 0, availableGroups);
        if (groupCount <= 0)
            return false;

        var groupIndex = Math.Clamp((int)proxy->LocalPlayerGroupIndex, 0, groupCount - 1);
        var group = proxy->CrossRealmGroups[groupIndex];

        var identities = new List<(string Name, ulong ContentId, bool IsLeader)>();
        var scanCount = Math.Min(8, group.GroupMembers.Length);
        for (var i = 0; i < scanCount; i++)
        {
            var member = group.GroupMembers[i];
            if (member.ContentId == 0)
                continue;

            var name = member.NameString.Trim();
            if (string.IsNullOrWhiteSpace(name))
                continue;

            identities.Add((name, member.ContentId, member.IsPartyLeader));
        }

        var memberCount = identities.Count;
        if (memberCount <= 1)
            return false;

        var leader = identities.FirstOrDefault(x => x.IsLeader);
        var recruiter = ResolveTrackedRecruiter(leader.Name);

        if (string.IsNullOrWhiteSpace(recruiter))
        {
            foreach (var identity in identities)
            {
                recruiter = ResolveTrackedRecruiter(identity.Name);
                if (!string.IsNullOrWhiteSpace(recruiter))
                    break;
            }
        }

        if (string.IsNullOrWhiteSpace(recruiter))
            recruiter = leader.Name ?? string.Empty;

        var fallbackContentId = leader.ContentId;
        if (fallbackContentId == 0 && identities.Count > 0)
            fallbackContentId = identities[0].ContentId;

        var effectivePartyId = fallbackContentId != 0
            ? unchecked((long)fallbackContentId)
            : 1;

        UpdateCurrentPartyState(
            effectivePartyId,
            recruiter,
            memberCount,
            string.IsNullOrWhiteSpace(recruiter)
                ? $"Current cross-world party: {memberCount}/8 - detected; waiting for recruiter data"
                : $"Current cross-world party: {memberCount}/8 - detected");

        return true;
    }

    private string ResolveTrackedRecruiter(string? playerName)
    {
        if (string.IsNullOrWhiteSpace(playerName))
            return string.Empty;

        var fingerprint = activePfAlerts.Keys.FirstOrDefault(key =>
            FingerprintRecruiterNameEquals(key, playerName) &&
            FingerprintMatchesConfiguredDuty(key, Configuration.DutyNameContains));

        return string.IsNullOrWhiteSpace(fingerprint)
            ? string.Empty
            : ExtractFingerprintRecruiter(fingerprint);
    }

    private static bool FingerprintRecruiterNameEquals(string fingerprint, string recruiterOrName)
    {
        if (string.IsNullOrWhiteSpace(fingerprint) || string.IsNullOrWhiteSpace(recruiterOrName))
            return false;

        var fingerprintRecruiter = ExtractFingerprintRecruiter(fingerprint);
        if (string.IsNullOrWhiteSpace(fingerprintRecruiter))
            return false;

        return string.Equals(
            ExtractPlayerName(fingerprintRecruiter),
            ExtractPlayerName(recruiterOrName),
            StringComparison.OrdinalIgnoreCase);
    }

    private static string ExtractFingerprintRecruiter(string fingerprint)
    {
        var first = fingerprint.IndexOf('\u001f');
        if (first < 0 || first + 1 >= fingerprint.Length)
            return string.Empty;

        var second = fingerprint.IndexOf('\u001f', first + 1);
        return (second >= 0
            ? fingerprint[(first + 1)..second]
            : fingerprint[(first + 1)..]).Trim();
    }

    private static string ExtractPlayerName(string identity)
    {
        var marker = identity.IndexOf(" @ ", StringComparison.Ordinal);
        return (marker >= 0 ? identity[..marker] : identity).Trim();
    }
}
'@ | Set-Content 'CrossRealmPartyTracker.cs' -NoNewline

          Set-Content 'version.txt' '0.7.12.0'
          Remove-Item '.github/workflows/repair-stability-pf.yml'

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize cross-world tracking and PF polling"
          git push origin HEAD:main
