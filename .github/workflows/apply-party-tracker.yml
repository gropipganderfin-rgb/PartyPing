name: Apply PartyPing Party Tracker

on:
  push:
    branches: [party-tracker-card]
    paths:
      - .github/workflows/apply-party-tracker.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: party-tracker-card
          fetch-depth: 0

      - name: Apply party tracker integration
        shell: pwsh
        run: |
          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $content = (Get-Content $Path -Raw) -replace "`r`n", "`n"
            $Old = $Old -replace "`r`n", "`n"
            $New = $New -replace "`r`n", "`n"
            if (-not $content.Contains($Old)) { throw "Expected block not found in $Path" }
            $content = $content.Replace($Old, $New)
            [System.IO.File]::WriteAllText($Path, $content, [System.Text.UTF8Encoding]::new($false))
          }

          Replace-Exact "Plugin.cs" "            TrackPartyFill();" "            TrackJoinedPartyCard();"

          $oldLocalStart = @'
        if (!Configuration.Enabled)
        {
            LocalPfStatus = "Local PF: enable Discord alerts first";
            return;
        }

        if (string.IsNullOrWhiteSpace(Configuration.DutyNameContains))
'@
          $newLocalStart = @'
        if (!Configuration.Enabled)
        {
            LocalPfStatus = "Local PF: enable Discord alerts first";
            return;
        }

        if (IsInTrackedNormalParty())
        {
            LocalPfStatus = $"Local PF: paused while joined party tracker is active ({PartyList.Length}/8)";
            return;
        }

        if (string.IsNullOrWhiteSpace(Configuration.DutyNameContains))
'@
          Replace-Exact "LocalPfScanner.cs" $oldLocalStart $newLocalStart

          $oldLocalProcess = @'
            LocalPfListingSnapshot[] listings;
            lock (localPfSync)
                listings = localPfReceived.Values.ToArray();

            await ProcessLocalPfResultsAsync(listings, cancellation.Token).ConfigureAwait(false);
'@
          $newLocalProcess = @'
            LocalPfListingSnapshot[] listings;
            lock (localPfSync)
                listings = localPfReceived.Values.ToArray();

            if (IsInTrackedNormalParty())
            {
                LocalPfStatus = $"Local PF: joined a party during refresh; PF cards suppressed ({PartyList.Length}/8)";
                return;
            }

            await ProcessLocalPfResultsAsync(listings, cancellation.Token).ConfigureAwait(false);
'@
          Replace-Exact "LocalPfScanner.cs" $oldLocalProcess $newLocalProcess

          $oldTrackerUi = @'
        DrawSectionHeader("My party tracker");

        var notifyWhenFull = Config.NotifyWhenPartyFull;
        if (ImGui.Checkbox("Notify me when my joined party reaches 8/8", ref notifyWhenFull))
        {
            Config.NotifyWhenPartyFull = notifyWhenFull;
            Config.Save();
        }
        ImGui.TextDisabled(plugin.PartyFillStatus);
'@
          $newTrackerUi = @'
        DrawSectionHeader("Joined party tracker");
        ImGui.TextWrapped("When you join a normal party, PartyPing clears its other tracked Discord posts and replaces them with one live Party Tracker card. The same card is edited whenever someone joins or leaves. When you leave the party, the tracker is removed and Party Finder alerts resume.");
        ImGui.TextDisabled(plugin.PartyFillStatus);
'@
          Replace-Exact "ConfigWindow.cs" $oldTrackerUi $newTrackerUi

          $genericAnchor = @'
        if (includeUsername)
        {
            return new
            {
                username = "PartyPing",
                content = body,
                embeds = Array.Empty<object>(),
                components = Array.Empty<object>(),
                allowed_mentions = allowedMentions,
            };
        }
'@
          $trackerPayload = @'
        if (TryParsePartyTrackerMessage(body, out var trackerParty, out var trackerMembers))
        {
            var embed = new
            {
                title = "Party Tracker",
                color = PartyFinderEmbedColor,
                fields = new object[]
                {
                    new { name = "Party", value = trackerParty, inline = true },
                    new { name = "Members", value = trackerMembers, inline = false },
                },
            };

            if (includeUsername)
            {
                return new
                {
                    username = "PartyPing",
                    content = string.Empty,
                    embeds = new[] { embed },
                    components = Array.Empty<object>(),
                    allowed_mentions = allowedMentions,
                };
            }

            return new
            {
                content = string.Empty,
                embeds = new[] { embed },
                components = Array.Empty<object>(),
                allowed_mentions = allowedMentions,
            };
        }

        if (includeUsername)
        {
            return new
            {
                username = "PartyPing",
                content = body,
                embeds = Array.Empty<object>(),
                components = Array.Empty<object>(),
                allowed_mentions = allowedMentions,
            };
        }
'@
          Replace-Exact "DiscordNotifier.cs" $genericAnchor $trackerPayload

          $helperAnchor = @'
    private static string CleanRoleDisplay(string role)
'@
          $trackerHelper = @'
    private static bool TryParsePartyTrackerMessage(
        string body,
        out string party,
        out string members)
    {
        party = string.Empty;
        members = string.Empty;

        var lines = body.Replace("\r\n", "\n", StringComparison.Ordinal).Split('\n');
        if (!lines.Any(x => x.Equals("## Party Tracker", StringComparison.Ordinal)))
            return false;

        party = FindField(lines, "**Party:**");
        var membersIndex = Array.FindIndex(lines, x => x.Equals("### Members", StringComparison.Ordinal));
        if (membersIndex < 0)
            return false;

        members = string.Join('\n', lines[(membersIndex + 1)..]
            .Where(x => !string.IsNullOrWhiteSpace(x)));

        if (string.IsNullOrWhiteSpace(members))
            members = "Party roster unavailable";

        party = Trim(party, 1024);
        members = Trim(members, 1024);
        return true;
    }

    private static string CleanRoleDisplay(string role)
'@
          Replace-Exact "DiscordNotifier.cs" $helperAnchor $trackerHelper

          [System.IO.File]::WriteAllText("version.txt", "0.7.6.0`n", [System.Text.UTF8Encoding]::new($false))

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          architecture: x64

      - name: Install Dalamud build files
        shell: pwsh
        run: |
          $dalamudPath = Join-Path $env:APPDATA "XIVLauncher\addon\Hooks\dev"
          $dalamudZip = Join-Path $env:RUNNER_TEMP "dalamud.zip"
          New-Item -ItemType Directory -Force -Path $dalamudPath | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile $dalamudZip
          Expand-Archive -Path $dalamudZip -DestinationPath $dalamudPath -Force

      - name: Restore
        run: dotnet restore .\PartyPing.csproj

      - name: Build
        run: dotnet build .\PartyPing.csproj -c Release -p:Platform=x64 --no-restore

      - name: Commit verified party tracker
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PartyTracker.cs Plugin.cs LocalPfScanner.cs DiscordNotifier.cs ConfigWindow.cs version.txt
          git commit -m "Add live joined-party Discord tracker"
          git push origin HEAD:party-tracker-card
