name: Verify Current Party Highlight

on:
  push:
    branches:
      - highlight-current-party
    paths:
      - .github/workflows/verify-current-party-highlight.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: highlight-current-party
          fetch-depth: 0

      - name: Apply current-party highlight patch
        run: python .\tools\apply_current_party_patch.py

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          architecture: x64

      - name: Install Dalamud build files
        shell: pwsh
        run: |
          $dalamudPath = Join-Path $env:APPDATA "XIVLauncher\addon\Hooks\dev"
          $dalamudZip = Join-Path $env:RUNNER_TEMP "dalamud.zip"
          New-Item -ItemType Directory -Force -Path $dalamudPath | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile $dalamudZip
          Expand-Archive -Path $dalamudZip -DestinationPath $dalamudPath -Force

      - name: Restore
        run: dotnet restore .\PartyPing.csproj

      - name: Build
        run: dotnet build .\PartyPing.csproj -c Release -p:Platform=x64 --no-restore

      - name: Commit verified highlight changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LocalPfScanner.cs DiscordNotifier.cs version.txt
          git commit -m "Highlight the current party PF card"
          git push origin HEAD:highlight-current-party

# retry: keep both Discord component objects the same anonymous type
