name: Apply PartyPing Open-Slot Role Fix

on:
  push:
    branches: [role-open-slot-fix]
    paths:
      - .github/workflows/apply-role-slot-fix.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: role-open-slot-fix
          fetch-depth: 0

      - name: Apply open-slot role fix
        shell: pwsh
        run: |
          $path = "LocalPfScanner.cs"
          $content = (Get-Content $path -Raw) -replace "`r`n", "`n"
          $old = "            var acceptedJobs = listing.Slots`n                .SelectMany(slot => slot.Accepting)`n                .Distinct()`n                .ToArray();"
          $new = "            // Only inspect seats that are currently open. Filled seats and padding must not count toward role availability.`n            var openSlotCount = Math.Max(0, listing.SlotsAvailable - listing.SlotsFilled);`n            var acceptedJobs = listing.Slots`n                .Skip(listing.SlotsFilled)`n                .Take(openSlotCount)`n                .SelectMany(slot => slot.Accepting)`n                .Distinct()`n                .ToArray();"
          if (-not $content.Contains($old)) { throw "Expected acceptedJobs block was not found." }
          $updated = $content.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $updated, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText("version.txt", "0.7.3.0`n", [System.Text.UTF8Encoding]::new($false))

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          architecture: x64

      - name: Install Dalamud build files
        shell: pwsh
        run: |
          $dalamudPath = Join-Path $env:APPDATA "XIVLauncher\addon\Hooks\dev"
          $dalamudZip = Join-Path $env:RUNNER_TEMP "dalamud.zip"
          New-Item -ItemType Directory -Force -Path $dalamudPath | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile $dalamudZip
          Expand-Archive -Path $dalamudZip -DestinationPath $dalamudPath -Force

      - name: Restore
        run: dotnet restore .\PartyPing.csproj

      - name: Build
        run: dotnet build .\PartyPing.csproj -c Release -p:Platform=x64 --no-restore

      - name: Commit verified fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LocalPfScanner.cs version.txt
          git commit -m "Fix role filtering to inspect only open PF slots"
          git push origin HEAD:role-open-slot-fix
