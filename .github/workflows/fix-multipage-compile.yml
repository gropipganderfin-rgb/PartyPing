name: Fix PartyPing multipage compile

on:
  push:
    paths:
      - '.github/workflows/fix-multipage-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix generated inheritance access
        run: python tools/fix_multipage_compile.py

      - name: Remove temporary repair files
        run: |
          rm -f tools/fix_multipage_compile.py
          rm -f .github/workflows/fix-multipage-compile.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix multipage PF addon inheritance access"
          git push origin HEAD:main
