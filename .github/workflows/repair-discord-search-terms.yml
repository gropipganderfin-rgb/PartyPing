name: Repair PartyPing Discord search terms

on:
  push:
    paths:
      - '.github/workflows/repair-discord-search-terms.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python tools/repair_discord_search_terms.py

      - name: Remove temporary repair files
        run: |
          rm tools/repair_discord_search_terms.py
          rm .github/workflows/repair-discord-search-terms.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Discord search terms control"
          git push
