name: Repair PartyPing P3 false negatives

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-p3-false-negative.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        shell: pwsh
        run: python tools/repair_p3_false_negative.py

      - name: Remove temporary repair files
        shell: pwsh
        run: |
          Remove-Item tools/repair_p3_false_negative.py
          Remove-Item .github/workflows/repair-p3-false-negative.yml

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PF role false negatives and diagnostics"
          git push origin HEAD:main
