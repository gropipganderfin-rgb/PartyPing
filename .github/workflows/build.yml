name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PartyPing.csproj

      - name: Build
        run: dotnet build PartyPing.csproj -c Release --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: PartyPing
          path: bin/Release/**
