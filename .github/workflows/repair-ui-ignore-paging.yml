name: Repair PartyPing UI ignore paging

on:
  push:
    paths:
      - '.github/workflows/repair-ui-ignore-paging.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python tools/repair_ui_ignore_paging.py

      - name: Remove temporary repair files
        run: |
          rm tools/repair_ui_ignore_paging.py
          rm .github/workflows/repair-ui-ignore-paging.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean UI, add PF ignore, fix background paging"
          git push
