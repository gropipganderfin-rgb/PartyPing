name: Repair PartyPing Cross-Realm PF

on:
  push:
    branches:
      - main
    paths:
      - tools/repair_crossrealm_pf.py
      - .github/workflows/repair-crossrealm-pf.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply repair
        run: python tools/repair_crossrealm_pf.py

      - name: Remove one-time repair files
        run: |
          rm tools/repair_crossrealm_pf.py
          rm .github/workflows/repair-crossrealm-pf.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix cross-world party and PF detection"
          git push
